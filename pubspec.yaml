name: eightclub
description: 8club Host Onboarding — Bifrost Architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  json_annotation: ^4.9.0

  record: ^5.2.0
  just_audio: ^0.9.40

  image_picker: ^1.1.2
  video_player: ^2.9.2

  path_provider: ^2.1.4
  permission_handler: ^11.3.1

  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
